<infer-image id="infer" name="images" multiple>
    <div id="results"></div>
</infer-image>
<template id="template-marker">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" stroke="limegreen" stroke-width="4px"
        stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M0 25 H45 L35 15 L45 25 L35 35" />
    </svg>
</template>

<script>
    const template = document.getElementById("template-marker");
    const SETTINGS_KEY = "toolbox-ui-cedirnet-detection-dialog";

    function filterDetectionIndices(scores, threshold) {
        const selected = [];
        for (let index = 0; index < scores.length; index++) {
            if (Number(scores[index]) >= threshold) selected.push(index);
        }
        return selected;
    }

    function thresholdSliderMaximum(scoreGroups) {
        const scores = scoreGroups.flat().map(Number).filter(Number.isFinite);
        return Math.max(1, ...scores);
    }

    function createMarker(markerSize, center, score, angle) {
        const marker = document.importNode(template.content.children[0], true);
        marker.classList.add("cedirnet-marker");
        marker.style.width = markerSize;
        marker.style.height = markerSize;
        marker.style.left = center[0] * 100 + "%";
        marker.style.top = center[1] * 100 + "%";
        marker.style.position = "absolute";
        marker.style.transformOrigin = "left center";
        marker.style.transform = `translateY(-50%) rotate(${Math.round(angle)}deg)`;
        marker.dataset.score = score;
        marker.title = `confidence ${Number(score).toFixed(3)}`;
        return marker;
    }

    function renderDetections(wrapper, image, centers, scores, angles, threshold) {
        wrapper.querySelectorAll(".cedirnet-marker").forEach(marker => marker.remove());
        const markerSize = Math.round(Math.max(image.clientWidth, image.clientHeight) * 0.05) + "px";
        for (const index of filterDetectionIndices(scores, threshold)) {
            const [x, y] = centers[index];
            wrapper.appendChild(createMarker(markerSize, [x, y], scores[index], angles[index]));
        }
    }

    function readSavedThreshold(maximum) {
        try {
            const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
            const threshold = Number(saved?.threshold);
            if (Number.isFinite(threshold)) return Math.min(maximum, Math.max(0, threshold));
        } catch (_) {
            // Ignore invalid stale browser settings and use the default.
        }
        return Math.min(0.5, maximum);
    }

    function configureThresholdSettings(scoreGroups, onThreshold) {
        const maximum = thresholdSliderMaximum(scoreGroups);
        let dialog = document.getElementById(SETTINGS_KEY);
        if (!dialog) {
            const controls = settings(SETTINGS_KEY);
            const button = controls.button;
            dialog = controls.dialog;

            const wrapper = document.createElement("div");
            wrapper.style = "display: flex; flex-direction: column; min-width: min(24rem, 70vw);";
            const thresholdLabel = document.createElement("label");
            const thresholdInput = document.createElement("input");
            thresholdInput.type = "range";
            thresholdInput.min = "0";
            thresholdInput.step = "0.01";

            const update = () => {
                const threshold = Number(thresholdInput.value);
                thresholdLabel.textContent = `Confidence threshold: ${threshold.toFixed(2)}`;
                dialog.cedirnetRender?.(threshold);
            };
            thresholdInput.addEventListener("input", update);

            button.addEventListener("click", () => {
                thresholdInput.value = String(readSavedThreshold(Number(thresholdInput.max)));
                update();
            });

            const cancel = document.createElement("button");
            cancel.innerText = "Cancel";
            cancel.addEventListener("click", event => {
                event.preventDefault();
                thresholdInput.value = String(readSavedThreshold(Number(thresholdInput.max)));
                update();
                dialog.close();
            });

            const submit = document.createElement("button");
            submit.innerText = "Ok";
            submit.addEventListener("click", event => {
                event.preventDefault();
                localStorage.setItem(SETTINGS_KEY, JSON.stringify({ threshold: thresholdInput.value }));
                update();
                dialog.close();
            });

            const actions = document.createElement("div");
            actions.style = "display: flex; justify-content: end; gap: 0.5rem; margin-top: 1rem;";
            actions.append(cancel, submit);
            wrapper.append(thresholdLabel, thresholdInput, actions);
            dialog.append(wrapper);
            dialog.cedirnetSlider = thresholdInput;
            dialog.cedirnetLabel = thresholdLabel;
            document.querySelector(".toolbar-right").append(button, dialog);

            const form = document.getElementById("infer").closest?.("form");
            const removeSettings = () => {
                button.remove();
                dialog.remove();
            };
            form?.addEventListener("infer", removeSettings, { once: true });
            form?.addEventListener("reset", removeSettings, { once: true });
        }

        dialog.cedirnetRender = onThreshold;
        dialog.cedirnetSlider.max = String(maximum);
        dialog.cedirnetSlider.value = String(readSavedThreshold(maximum));
        dialog.cedirnetLabel.textContent = `Confidence threshold: ${Number(dialog.cedirnetSlider.value).toFixed(2)}`;
        onThreshold(Number(dialog.cedirnetSlider.value));
    }

    document.getElementById("infer").onInference = function (request, response) {
        const group = document.createElement("div");
        group.classList.add("group");
        const images = request.getAll("images");
        const { centers, scores, angles } = response;
        const rendered = [];

        let threshold = 0.5;
        const renderAll = () => {
            for (const item of rendered) {
                renderDetections(
                    item.wrapper,
                    item.image,
                    centers[item.index],
                    scores[item.index],
                    angles[item.index],
                    threshold,
                );
            }
        };
        configureThresholdSettings(scores, value => {
            threshold = value;
            renderAll();
        });

        for (let i = 0; i < images.length; i++) {
            const wrapper = document.createElement("div");
            wrapper.style.position = "relative";
            wrapper.style.width = "fit-content";

            const image = document.createElement("img");
            const imageUrl = URL.createObjectURL(images[i]);
            image.src = imageUrl;
            image.onload = () => {
                rendered.push({ index: i, wrapper, image });
                renderDetections(wrapper, image, centers[i], scores[i], angles[i], threshold);
                URL.revokeObjectURL(imageUrl);
            };
            wrapper.appendChild(image);
            group.appendChild(wrapper);
        }
        return group;
    }
</script>
