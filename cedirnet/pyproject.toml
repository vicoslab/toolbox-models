[project]
name = "toolbox-cedirnet"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "future>=1.0.0",
    "huggingface-hub==1.33.0",
    "label-studio-ml",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "modelargs",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "segmentation-models-pytorch==0.3.3",
    "six>=1.17.0",
    "tensorboard>=2.21.0",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
modelargs = { path = "/opt/apps/modelargs", editable = true }
label-studio-ml = { path = "/opt/apps/label-studio-ml-backend", editable = true }
