[project]
name = "toolbox-geco2"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "einops==0.8.1",
    "gunicorn>=27.0.1",
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "label-studio-ml",
    "matplotlib>=3.11.2",
    "modelargs",
    "multiscaledeformableattention",
    "omegaconf==2.3.0",
    "opencv-python-headless>=4.11.0.86",
    "pandas==2.2.3",
    "pycocotools>=2.0.11",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
multiscaledeformableattention = { url = "https://github.com/vicoslab/toolbox-models/releases/download/slaif-1.1.1/multiscaledeformableattention-1.0-cp311-cp311-linux_x86_64.whl" }
modelargs = { path = "/opt/apps/modelargs", editable = true }
label-studio-ml = { path = "/opt/apps/label-studio-ml-backend", editable = true }
