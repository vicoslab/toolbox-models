<infer-image id="infer" name="images" multiple placeholder="Select pairs of STEM images (first BF, then HAADF)">
  <div id="results"></div>
</infer-image>

<script>
  const ZIP_UTF8_FLAG = 0x0800;
  const ZIP16_MAX = 0xffff;
  const ZIP32_MAX = 0xffffffff;
  const CRC32_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < table.length; n++) {
      let value = n;
      for (let bit = 0; bit < 8; bit++) {
        value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
      }
      table[n] = value >>> 0;
    }
    return table;
  })();

  const VIEW_KEY = "toolbox-ui-stem-inference";

  function normalizeView(value, maximum, defaultThreshold = .5) {
    const bounded = (v, fallback, max) => typeof v === "number" && Number.isFinite(v)
      ? Math.max(0, Math.min(max, v)) : Math.max(0, Math.min(max, fallback));
    return {threshold: bounded(value?.threshold, defaultThreshold, maximum),
      minRadius: bounded(value?.minRadius, 0, 1000000),
      hiddenClasses: Array.isArray(value?.hiddenClasses) ? value.hiddenClasses.filter(x => typeof x === "string") : []};
  }

  function filterParticles(result, view) {
    const selected = {centers: [], scores: [], radii: [], segmentation: result.segmentation};
    for (let i = 0; i < result.centers.length; i++) {
      const center = result.centers[i], radius = result.radii[i], score = result.scores[i];
      if (!center?.slice(0, 2).every(Number.isFinite) || center.length < 2 ||
          !Number.isFinite(radius) || radius <= 0 || !Number.isFinite(score) ||
          score < view.threshold || radius < view.minRadius) continue;
      selected.centers.push(center); selected.scores.push(score); selected.radii.push(radius);
    }
    return selected;
  }

  function semanticPixels(ids, segmentation, hiddenClasses) {
    const rgba = new Uint8ClampedArray(ids.length);
    const hidden = new Set(hiddenClasses);
    for (let p = 0; p < ids.length; p += 4) {
      const id = ids[p], color = segmentation.colors[id];
      if (!color) continue;
      rgba.set(color, p);
      rgba[p + 3] = hidden.has(segmentation.classes[id]) ? 0 : 120;
    }
    return rgba;
  }

  async function semanticCanvas(segmentation, hiddenClasses) {
    const mask = await loadDataImage(segmentation.mask_png);
    const canvas = document.createElement("canvas");
    canvas.width = mask.naturalWidth; canvas.height = mask.naturalHeight;
    const context = canvas.getContext("2d", {willReadFrequently: true});
    context.drawImage(mask, 0, 0);
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
    pixels.data.set(semanticPixels(pixels.data, segmentation, hiddenClasses));
    context.putImageData(pixels, 0, 0);
    return canvas;
  }

  async function loadBrowserImage(file) {
    if (/\.tiff?$/i.test(file.name)) {
      if (typeof UTIF === "undefined") throw new Error("TIFF decoding requires the host UTIF decoder");
      return loadDataImage(UTIF.bufferToURI(await file.arrayBuffer()));
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error(`Could not decode image: ${file.name}`));
      };
      image.src = url;
    });
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (blob) resolve(blob);
        else reject(new Error("Could not rasterize inference plot"));
      }, "image/png");
    });
  }

  async function renderAnnotatedPng(file, centers, scores, radii, segmentation = null, hiddenClasses = []) {
    const image = await loadBrowserImage(file);
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    const context = canvas.getContext("2d");
    if (!context) throw new Error("Canvas rendering is unavailable");

    context.drawImage(image, 0, 0);
    if (segmentation) {
      const overlay = await semanticCanvas(segmentation, hiddenClasses);
      context.imageSmoothingEnabled = false;
      context.drawImage(overlay, 0, 0, canvas.width, canvas.height);
    }
    context.strokeStyle = "limegreen";
    context.lineWidth = Math.max(2, Math.round(Math.min(canvas.width, canvas.height) / 512 * 2));

    for (let i = 0; i < centers.length; i++) {
      const x = centers[i][0] * canvas.width;
      const y = centers[i][1] * canvas.height;
      const radius = radii[i];
      context.beginPath();
      context.arc(x, y, radius, 0, 2 * Math.PI);
      context.stroke();
    }

    return canvasToBlob(canvas);
  }

  function crc32(bytes) {
    let crc = 0xffffffff;
    for (const byte of bytes) {
      crc = CRC32_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8);
    }
    return (crc ^ 0xffffffff) >>> 0;
  }

  function zipTimestamp(date) {
    const year = Math.max(1980, date.getFullYear());
    return {
      time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2),
      date: ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
    };
  }

  function assertClassicZipLimit(value, bits, label) {
    const maximum = bits === 16 ? ZIP16_MAX : ZIP32_MAX;
    if (!Number.isSafeInteger(value) || value < 0 || value > maximum) {
      throw new Error(`${label} exceeds the classic ZIP ${bits}-bit limit`);
    }
  }

  function writeZipHeader(size, fields) {
    const bytes = new Uint8Array(size);
    const view = new DataView(bytes.buffer);
    for (const [offset, width, value] of fields) {
      if (width === 2) view.setUint16(offset, value, true);
      else view.setUint32(offset, value, true);
    }
    return bytes;
  }

  async function buildZip(entries) {
    assertClassicZipLimit(entries.length, 16, "ZIP entry count");
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let localOffset = 0;
    let centralSize = 0;

    for (const entry of entries) {
      const name = encoder.encode(entry.name);
      assertClassicZipLimit(name.length, 16, "ZIP filename length");
      const data = new Uint8Array(await entry.blob.arrayBuffer());
      assertClassicZipLimit(data.length, 32, "ZIP file size");
      assertClassicZipLimit(localOffset, 32, "ZIP local-header offset");
      const checksum = crc32(data);
      const timestamp = zipTimestamp(new Date());
      const localHeader = writeZipHeader(30 + name.length, [
        [0, 4, 0x04034b50], [4, 2, 20], [6, 2, ZIP_UTF8_FLAG], [8, 2, 0],
        [10, 2, timestamp.time], [12, 2, timestamp.date], [14, 4, checksum],
        [18, 4, data.length], [22, 4, data.length], [26, 2, name.length], [28, 2, 0],
      ]);
      localHeader.set(name, 30);

      const centralHeader = writeZipHeader(46 + name.length, [
        [0, 4, 0x02014b50], [4, 2, 20], [6, 2, 20], [8, 2, ZIP_UTF8_FLAG],
        [10, 2, 0], [12, 2, timestamp.time], [14, 2, timestamp.date],
        [16, 4, checksum], [20, 4, data.length], [24, 4, data.length],
        [28, 2, name.length], [30, 2, 0], [32, 2, 0], [34, 2, 0],
        [36, 2, 0], [38, 4, 0], [42, 4, localOffset],
      ]);
      centralHeader.set(name, 46);

      localParts.push(localHeader, data);
      centralParts.push(centralHeader);
      const nextLocalOffset = localOffset + localHeader.length + data.length;
      const nextCentralSize = centralSize + centralHeader.length;
      assertClassicZipLimit(nextLocalOffset, 32, "ZIP local-data size");
      assertClassicZipLimit(nextCentralSize, 32, "ZIP central-directory size");
      localOffset = nextLocalOffset;
      centralSize = nextCentralSize;
    }

    assertClassicZipLimit(
      localOffset + centralSize + 22,
      32,
      "ZIP archive size",
    );
    const end = writeZipHeader(22, [
      [0, 4, 0x06054b50], [4, 2, 0], [6, 2, 0],
      [8, 2, entries.length], [10, 2, entries.length],
      [12, 4, centralSize], [16, 4, localOffset], [20, 2, 0],
    ]);
    return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
  }

  function annotatedFilename(file, index) {
    const base = file.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9._-]+/g, "-");
    return `${String(index + 1).padStart(3, "0")}-${base}-cedirnet.png`;
  }

  function downloadBlob(blob, filename) {
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function loadDataImage(uri) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("Could not decode semantic overlay"));
      image.src = uri;
    });
  }

  function sampleResult(response, i) {
    return { centers: response.centers?.[i] || [], scores: response.scores?.[i] || [],
      radii: response.radii?.[i] || [], segmentation: response.segmentation?.[i] || null };
  }

  document.getElementById("infer").onInference = function (request, response) {
    if (response.error) throw new Error(response.error);
    const images = request.getAll("images");
    if (images.length % 2) throw new Error("Select matching BF / HAADF pairs");
    document.getElementById(VIEW_KEY)?.stemDispose?.();
    const results = images.filter((_, i) => i % 2 === 0).map((_, i) => ({
      ...sampleResult(response, i), "image-BF": images[2*i].name, "image-HAADF": images[2*i+1].name,
    }));
    const group = document.createElement("div");
    group.className = "group stem-results";
    group.style.cssText = "display:flex; flex-direction:column; gap:1rem; pointer-events:auto";
    const actions = document.createElement("div");
    actions.style.cssText = "display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; pointer-events:auto";
    const status = document.createElement("span");
    status.setAttribute("role", "status");
    const jsonDownload = document.createElement("button");
    jsonDownload.type = "button"; jsonDownload.textContent = "Download JSON (all candidates)";
    jsonDownload.onclick = () => downloadBlob(new Blob([JSON.stringify(results, null, 2)],
      {type:"application/json"}), "results-cedirnet.json");
    const imageDownload = document.createElement("button");
    imageDownload.type = "button"; imageDownload.textContent = "Download images (.zip)";
    actions.append(jsonDownload, imageDownload, status);

    const maximum = results.reduce((max, r) => r.scores.reduce((m, s) =>
      Number.isFinite(s) ? Math.max(m, s + .01) : m, max), 1);
    let saved;
    try { saved = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (_) { /* private/corrupt storage */ }
    let view = normalizeView(saved, maximum, response.display_score_threshold ?? .5);
    let accepted = structuredClone(view);
    const classes = new Map();
    results.forEach(r => r.segmentation?.classes.forEach((name, id) => classes.set(name, r.segmentation.colors[id])));
    const hasParticles = results.some(r => r.scores.length);
    const {button, dialog} = settings(VIEW_KEY);
    button.type = "button"; button.title = "STEM visualization settings";
    button.setAttribute("aria-label", button.title);
    button.disabled = !hasParticles && !classes.size;
    dialog.setAttribute("aria-label", "STEM visualization settings");
    const panel = document.createElement("div");
    panel.style.cssText = "display:flex; flex-direction:column; gap:.75rem; width:min(28rem,70vw)";
    dialog.style.maxHeight = "90vh";
    dialog.style.overflow = "auto";
    const title = document.createElement("h3"); title.textContent = "STEM visualization";
    panel.append(title);
    const makeControl = (labelText, name, type, max, step) => {
      const label = document.createElement("label");
      const text = document.createElement("span");
      const input = document.createElement("input");
      input.type = type; input.min = "0"; input.max = String(max); input.step = step;
      input.dataset.control = name; input.disabled = !hasParticles;
      input.style.cssText = "display:block; width:100%";
      input.setAttribute("aria-label", labelText);
      label.append(text, input); panel.append(label);
      const sync = () => { input.value = String(view[name]); text.textContent = `${labelText}: ${view[name].toFixed(2)}`; };
      input.addEventListener("input", () => {
        view = normalizeView({...view, [name]: input.valueAsNumber}, maximum, accepted.threshold);
        sync(); renderAll();
      });
      return sync;
    };
    const syncThreshold = makeControl("Particle score threshold", "threshold", "range", maximum, "any");
    const syncRadius = makeControl("Minimum radius (original pixels)", "minRadius", "number", 1000000, "0.1");
    const note = document.createElement("small");
    note.textContent = `Display filters only. Candidate score cutoff: ${response.candidate_score_threshold ?? "unknown (older server)"}. Lowering filters cannot recover candidates rejected by the model localizer. Class-ID masks and JSON stay unfiltered.`;
    panel.append(note);
    const semanticGroup = document.createElement("fieldset");
    semanticGroup.disabled = !classes.size;
    semanticGroup.style.cssText = "display:flex; flex-direction:column; gap:.25rem";
    const legend = document.createElement("legend"); legend.textContent = "Segmentation classes";
    semanticGroup.append(legend);
    const checks = [];
    for (const [name, color] of classes) {
      const label = document.createElement("label");
      label.style.cssText = "display:flex; align-items:center; gap:.5rem; margin:.5rem 0";
      const check = document.createElement("input"); check.type = "checkbox"; check.dataset.className = name;
      const swatch = document.createElement("span");
      swatch.style.cssText = `width:1rem; height:1rem; background:rgb(${color.join(",")}); border:1px solid currentColor`;
      label.append(check, swatch, document.createTextNode(name)); semanticGroup.append(label);
      check.onchange = () => {
        view.hiddenClasses = [...new Set([...view.hiddenClasses.filter(n => n !== name), ...(check.checked ? [] : [name])])];
        renderAll();
      };
      checks.push([name, check]);
    }
    for (const [label, hidden] of [["All", false], ["None", true]]) {
      const action = document.createElement("button"); action.type = "button"; action.textContent = label;
      action.onclick = () => {
        view.hiddenClasses = view.hiddenClasses.filter(n => !classes.has(n));
        if (hidden) view.hiddenClasses.push(...classes.keys());
        syncControls(); renderAll();
      };
      semanticGroup.append(action);
    }
    panel.append(semanticGroup);
    const syncControls = () => {
      syncThreshold(); syncRadius();
      checks.forEach(([name, check]) => check.checked = !view.hiddenClasses.includes(name));
    };
    const buttons = document.createElement("div");
    buttons.style.cssText = "display:flex; justify-content:end; gap:.5rem";
    const cancel = document.createElement("button"); cancel.type = "button"; cancel.textContent = "Cancel";
    const rollback = () => { view = structuredClone(accepted); syncControls(); renderAll(); };
    cancel.onclick = () => { rollback(); dialog.close(); };
    dialog.addEventListener("cancel", rollback);
    const ok = document.createElement("button"); ok.type = "button"; ok.textContent = "Ok";
    ok.onclick = () => {
      accepted = structuredClone(view);
      try { localStorage.setItem(VIEW_KEY, JSON.stringify(accepted)); } catch (_) { /* storage may be disabled */ }
      dialog.close();
    };
    buttons.append(cancel, ok); panel.append(buttons); dialog.append(panel);
    (document.querySelector(".toolbar-right") || actions).append(button, dialog);
    syncControls();

    const rendered = [];
    results.forEach((result, i) => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex; flex-wrap:wrap; gap:1rem";
      for (let modality = 0; modality < 2; modality++) {
        const file = images[2*i + modality];
        const figure = document.createElement("figure");
        figure.style.cssText = "margin:0; width:512px; max-width:100%";
        const caption = document.createElement("figcaption");
        caption.textContent = `${modality ? "HAADF" : "BF"}: ${file.name}`;
        const image = document.createElement("img"); image.alt = caption.textContent;
        image.className = "stem-annotated";
        image.style.cssText = "display:block; max-width:min(512px,100%); height:auto";
        figure.append(caption, image); row.append(figure);
        rendered.push({image, file, result, index:2*i+modality});
      }
      group.append(row);
      if (result.segmentation) {
        const maskDownload = document.createElement("a");
        maskDownload.textContent = `Sample ${i+1}: Download class-ID mask PNG (all classes)`;
        maskDownload.href = result.segmentation.mask_png; maskDownload.download = `${i+1}-semantic-mask.png`;
        group.append(maskDownload);
      }
    });
    let revision = 0, disposed = false, entries = [], urls = [];
    async function renderAll() {
      const current = ++revision, snapshot = structuredClone(view);
      imageDownload.disabled = true; status.textContent = "Rendering…";
      try {
        const next = await Promise.all(rendered.map(async item => {
          const r = filterParticles(item.result, snapshot);
          const blob = await renderAnnotatedPng(item.file, r.centers, r.scores, r.radii, r.segmentation, snapshot.hiddenClasses);
          return {name: annotatedFilename(item.file, item.index), blob};
        }));
        if (current !== revision || disposed) return;
        urls.forEach(url => URL.revokeObjectURL(url));
        urls = next.map(e => URL.createObjectURL(e.blob));
        rendered.forEach((item, i) => item.image.src = urls[i]);
        entries = next;
        const count = results.reduce((n, r) => n + filterParticles(r, snapshot).centers.length, 0);
        status.textContent = `${count} particles shown across ${results.length} samples`;
        group.dataset.particleCount = String(count);
        group.dataset.revision = String(current);
        imageDownload.disabled = !entries.length;
      } catch (error) {
        if (current !== revision || disposed) return;
        status.textContent = `Could not render images: ${error.message}`;
        console.error(error);
      }
    }
    imageDownload.onclick = async () => {
      imageDownload.disabled = true;
      try { downloadBlob(await buildZip(entries), "results-cedirnet-images.zip"); }
      catch (error) { status.textContent = `Could not prepare images: ${error.message}`; }
      finally { if (!disposed) imageDownload.disabled = false; }
    };
    const form = document.getElementById("infer").closest("form");
    const dispose = () => {
      disposed = true; revision++;
      urls.forEach(url => URL.revokeObjectURL(url)); button.remove(); dialog.remove();
      for (const event of ["infer", "reset", "softreset"]) form?.removeEventListener(event, dispose);
    };
    dialog.stemDispose = dispose;
    for (const event of ["infer", "reset", "softreset"]) form?.addEventListener(event, dispose);
    renderAll();
    return [actions, group];
  };
</script>
