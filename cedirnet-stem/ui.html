<!-- The host fieldset is an auto/1fr grid. Slotted results have no intrinsic
     width because infer-image puts its slot in an absolute overlay. Span both
     tracks so percentage-constrained result images cannot collapse to zero. -->
<infer-image style="grid-column:1 / -1; display:block; width:100%; min-width:0" id="@ALIAS@" name="images" multiple
  placeholder="Select pairs of STEM images (first BF, then HAADF)">
  <div id="results"></div>
</infer-image>

<script>
  const ZIP_UTF8_FLAG = 0x0800;
  const ZIP16_MAX = 0xffff;
  const ZIP32_MAX = 0xffffffff;
  const CRC32_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < table.length; n++) {
      let value = n;
      for (let bit = 0; bit < 8; bit++) {
        value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
      }
      table[n] = value >>> 0;
    }
    return table;
  })();

  const VIEW_KEY = "toolbox-ui-stem-inference";

  function normalizeView(value, maximum, defaultThreshold = .5) {
    const bounded = (v, fallback, max) => typeof v === "number" && Number.isFinite(v)
      ? Math.max(0, Math.min(max, v)) : Math.max(0, Math.min(max, fallback));
    return {
      threshold: bounded(value?.threshold, defaultThreshold, maximum),
      minRadius: bounded(value?.minRadius, 0, 1000000),
      hiddenClasses: Array.isArray(value?.hiddenClasses) ? value.hiddenClasses.filter(x => typeof x === "string") : []
    };
  }

  function filterParticles(result, view) {
    const selected = { centers: [], scores: [], radii: [], segmentation: result.segmentation };
    for (let i = 0; i < result.centers.length; i++) {
      const center = result.centers[i], radius = result.radii[i], score = result.scores[i];
      if (!center?.slice(0, 2).every(Number.isFinite) || center.length < 2 ||
        !Number.isFinite(radius) || radius <= 0 || !Number.isFinite(score) ||
        score < view.threshold || radius < view.minRadius) continue;
      selected.centers.push(center); selected.scores.push(score); selected.radii.push(radius);
    }
    return selected;
  }

  function semanticPixels(ids, segmentation, hiddenClasses, rgba = new Uint8ClampedArray(ids.length)) {
    // Resolve visibility once per class rather than a string/Set lookup per pixel.
    const palette = new Uint8ClampedArray(256 * 4);
    segmentation.colors.forEach((color, id) => {
      palette.set(color.slice(0, 3), id * 4);
      palette[id * 4 + 3] = hiddenClasses.includes(segmentation.classes[id]) ? 0 : 120;
    });
    for (let p = 0; p < ids.length; p += 4) {
      const offset = ids[p] * 4;
      rgba[p] = palette[offset]; rgba[p + 1] = palette[offset + 1];
      rgba[p + 2] = palette[offset + 2]; rgba[p + 3] = palette[offset + 3];
    }
    return rgba;
  }

  const MASK_IGNORE_COLOR = [128, 128, 128];

  function colorMaskPixels(ids, segmentation) {
    // Independent of the translucent/filtered display overlay. ID 0 is a class.
    const rgba = new Uint8ClampedArray(ids.length);
    for (let p = 0; p < ids.length; p += 4) {
      const id = ids[p];
      const color = id === 255 ? MASK_IGNORE_COLOR : segmentation.colors[id];
      if (!color) throw new Error(`No color configured for mask class ID ${id}`);
      rgba[p] = color[0]; rgba[p + 1] = color[1]; rgba[p + 2] = color[2]; rgba[p + 3] = 255;
    }
    return rgba;
  }

  async function colorMaskBlob(cache) {
    const canvas = document.createElement("canvas");
    canvas.width = cache.canvas.width; canvas.height = cache.canvas.height;
    canvas.getContext("2d").putImageData(new ImageData(
      colorMaskPixels(cache.ids, cache.segmentation), canvas.width, canvas.height), 0, 0);
    return new Promise((resolve, reject) => canvas.toBlob(blob => {
      canvas.width = canvas.height = 0;
      if (blob) resolve(blob);
      else reject(new Error("Could not encode color mask"));
    }, "image/png"));
  }

  function enabledTasks(response) {
    // Explicit worker metadata takes precedence, including enabled-but-empty tasks.
    return response.tasks || {
      nanoparticles: Array.isArray(response.centers),
      segmentation: Boolean(response.segmentation?.some(Boolean))
    };
  }

  async function prepareSemantic(segmentation) {
    if (!segmentation) return null;
    const mask = await loadDataImage(segmentation.mask_png);
    const canvas = document.createElement("canvas");
    canvas.width = mask.naturalWidth; canvas.height = mask.naturalHeight;
    const context = canvas.getContext("2d", { willReadFrequently: true });
    context.drawImage(mask, 0, 0);
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
    // Decode once per sample, share the colored overlay between BF and HAADF.
    return { canvas, context, pixels, ids: pixels.data.slice(), segmentation, key: null };
  }

  function updateSemantic(cache, hiddenClasses) {
    if (!cache) return;
    const key = JSON.stringify(hiddenClasses);
    if (cache.key === key) return;
    semanticPixels(cache.ids, cache.segmentation, hiddenClasses, cache.pixels.data);
    cache.context.putImageData(cache.pixels, 0, 0);
    cache.key = key;
  }

  async function loadBrowserImage(file) {
    if (/\.tiff?$/i.test(file.name)) {
      if (typeof UTIF === "undefined") throw new Error("TIFF decoding requires the host UTIF decoder");
      return loadDataImage(UTIF.bufferToURI(await file.arrayBuffer()));
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error(`Could not decode image: ${file.name}`));
      };
      image.src = url;
    });
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (blob) resolve(blob);
        else reject(new Error("Could not rasterize inference plot"));
      }, "image/jpeg", .95);
    });
  }

  function drawAnnotated(item, view) {
    const { canvas, source, semantic, result } = item;
    const context = canvas.getContext("2d");
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.drawImage(source, 0, 0);
    if (semantic) {
      updateSemantic(semantic, view.hiddenClasses);
      context.imageSmoothingEnabled = false;
      context.drawImage(semantic.canvas, 0, 0, canvas.width, canvas.height);
    }
    context.strokeStyle = "limegreen";
    context.lineWidth = Math.max(2, Math.round(Math.min(canvas.width, canvas.height) / 512 * 2));
    const { centers, radii } = filterParticles(result, view);
    for (let i = 0; i < centers.length; i++) {
      context.beginPath();
      context.arc(centers[i][0] * canvas.width, centers[i][1] * canvas.height, radii[i], 0, 2 * Math.PI);
      context.stroke();
    }
  }

  function maskBlob(segmentation) {
    // Preserve the worker's original PNG bytes, not the colored display canvas.
    const binary = atob(segmentation.mask_png.split(",")[1]);
    return new Blob([Uint8Array.from(binary, c => c.charCodeAt(0))], { type: "image/png" });
  }

  function crc32(bytes) {
    let crc = 0xffffffff;
    for (const byte of bytes) {
      crc = CRC32_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8);
    }
    return (crc ^ 0xffffffff) >>> 0;
  }

  function zipTimestamp(date) {
    const year = Math.max(1980, date.getFullYear());
    return {
      time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2),
      date: ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
    };
  }

  function assertClassicZipLimit(value, bits, label) {
    const maximum = bits === 16 ? ZIP16_MAX : ZIP32_MAX;
    if (!Number.isSafeInteger(value) || value < 0 || value > maximum) {
      throw new Error(`${label} exceeds the classic ZIP ${bits}-bit limit`);
    }
  }

  function writeZipHeader(size, fields) {
    const bytes = new Uint8Array(size);
    const view = new DataView(bytes.buffer);
    for (const [offset, width, value] of fields) {
      if (width === 2) view.setUint16(offset, value, true);
      else view.setUint32(offset, value, true);
    }
    return bytes;
  }

  async function buildZip(entries) {
    assertClassicZipLimit(entries.length, 16, "ZIP entry count");
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let localOffset = 0;
    let centralSize = 0;

    for (const entry of entries) {
      const name = encoder.encode(entry.name);
      assertClassicZipLimit(name.length, 16, "ZIP filename length");
      const data = new Uint8Array(await entry.blob.arrayBuffer());
      assertClassicZipLimit(data.length, 32, "ZIP file size");
      assertClassicZipLimit(localOffset, 32, "ZIP local-header offset");
      const checksum = crc32(data);
      const timestamp = zipTimestamp(new Date());
      const localHeader = writeZipHeader(30 + name.length, [
        [0, 4, 0x04034b50], [4, 2, 20], [6, 2, ZIP_UTF8_FLAG], [8, 2, 0],
        [10, 2, timestamp.time], [12, 2, timestamp.date], [14, 4, checksum],
        [18, 4, data.length], [22, 4, data.length], [26, 2, name.length], [28, 2, 0],
      ]);
      localHeader.set(name, 30);

      const centralHeader = writeZipHeader(46 + name.length, [
        [0, 4, 0x02014b50], [4, 2, 20], [6, 2, 20], [8, 2, ZIP_UTF8_FLAG],
        [10, 2, 0], [12, 2, timestamp.time], [14, 2, timestamp.date],
        [16, 4, checksum], [20, 4, data.length], [24, 4, data.length],
        [28, 2, name.length], [30, 2, 0], [32, 2, 0], [34, 2, 0],
        [36, 2, 0], [38, 4, 0], [42, 4, localOffset],
      ]);
      centralHeader.set(name, 46);

      localParts.push(localHeader, data);
      centralParts.push(centralHeader);
      const nextLocalOffset = localOffset + localHeader.length + data.length;
      const nextCentralSize = centralSize + centralHeader.length;
      assertClassicZipLimit(nextLocalOffset, 32, "ZIP local-data size");
      assertClassicZipLimit(nextCentralSize, 32, "ZIP central-directory size");
      localOffset = nextLocalOffset;
      centralSize = nextCentralSize;
    }

    assertClassicZipLimit(
      localOffset + centralSize + 22,
      32,
      "ZIP archive size",
    );
    const end = writeZipHeader(22, [
      [0, 4, 0x06054b50], [4, 2, 0], [6, 2, 0],
      [8, 2, entries.length], [10, 2, entries.length],
      [12, 4, centralSize], [16, 4, localOffset], [20, 2, 0],
    ]);
    return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
  }

  function annotatedFilename(file, index) {
    const base = file.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9._-]+/g, "-");
    return `${String(index + 1).padStart(3, "0")}-${base}-cedirnet.jpg`;
  }

  function downloadBlob(blob, filename) {
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function loadDataImage(uri) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("Could not decode semantic overlay"));
      image.src = uri;
    });
  }

  function sampleResult(response, i) {
    return {
      centers: response.centers?.[i] || [], scores: response.scores?.[i] || [],
      radii: response.radii?.[i] || [], segmentation: response.segmentation?.[i] || null
    };
  }

  document.getElementById("@ALIAS@").onInference = function (request, response) {
    if (response.error) throw new Error(response.error);
    const images = request.getAll("images");
    if (images.length % 2) throw new Error("Select matching BF / HAADF pairs");
    document.getElementById(VIEW_KEY)?.stemDispose?.();
    const tasks = enabledTasks(response);
    const results = images.filter((_, i) => i % 2 === 0).map((_, i) => ({
      ...sampleResult(response, i), "image-BF": images[2 * i].name, "image-HAADF": images[2 * i + 1].name,
    }));
    const group = document.createElement("div");
    group.className = "group stem-results";
    group.style.cssText = "display:flex; flex-direction:column; gap:1rem; pointer-events:auto";
    const actions = document.createElement("div");
    actions.style.cssText = "display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem; pointer-events:auto";

    const jsonDownload = document.createElement("button");
    jsonDownload.type = "button"; jsonDownload.textContent = "Download detections";
    jsonDownload.title = "JSON: all returned candidates, without display filtering";
    jsonDownload.onclick = () => downloadBlob(new Blob([JSON.stringify(results, null, 2)],
      { type: "application/json" }), "results-cedirnet.json");
    const maskDownload = document.createElement("button");
    maskDownload.type = "button"; maskDownload.textContent = "Download mask";
    maskDownload.title = "ZIP: original class-ID PNGs + full-color PNGs and classes.json, all classes unfiltered";
    maskDownload.disabled = true;
    maskDownload.onclick = async () => {
      if (!prepared || disposed) return;
      maskDownload.disabled = true;
      try {
        const entries = [], samples = [];
        for (const [i, r] of results.entries()) {
          if (!r.segmentation) continue;
          const name = annotatedFilename(images[2 * i], i).replace(/-cedirnet\.jpg$/, "-mask.png");
          const classId = `class-id/${name}`, color = `color/${name}`;
          entries.push({ name: classId, blob: maskBlob(r.segmentation) },
            { name: color, blob: await colorMaskBlob(rendered[2 * i].semantic) });
          samples.push({
            class_id: classId, color, classes: r.segmentation.classes.map((name, id) =>
              ({ id, name, rgb: r.segmentation.colors[id] }))
          });
        }
        entries.push({
          name: "classes.json", blob: new Blob([JSON.stringify({
            description: "Unfiltered native-resolution masks. class-id/ preserves original IDs; color/ is an opaque visualization. Class 0 is not implicit background.",
            ignore: { id: 255, name: "Ignore", rgb: MASK_IGNORE_COLOR }, samples,
          }, null, 2)], { type: "application/json" })
        });
        const archive = await buildZip(entries);
        if (!disposed) downloadBlob(archive, "results-cedirnet-masks.zip");
      } catch (error) { showToast("error", `Could not prepare masks: ${error.message}`); }
      finally { if (!disposed) maskDownload.disabled = false; }
    };
    const imageDownload = document.createElement("button");
    imageDownload.type = "button"; imageDownload.textContent = "Download visualizations";
    imageDownload.title = "ZIP: native-resolution JPEG images (quality 95%), current display filters";
    imageDownload.disabled = true;
    if (tasks.nanoparticles) actions.append(jsonDownload);
    if (tasks.segmentation) actions.append(maskDownload);
    if (tasks.nanoparticles || tasks.segmentation) actions.append(imageDownload);

    const maximum = results.reduce((max, r) => r.scores.reduce((m, s) =>
      Number.isFinite(s) ? Math.max(m, s + .01) : m, max), 1);
    let saved;
    try { saved = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (_) { /* private/corrupt storage */ }
    let view = normalizeView(saved, maximum, response.display_score_threshold ?? .5);

    const classes = new Map();
    results.forEach(r => r.segmentation?.classes.forEach((name, id) => classes.set(name, r.segmentation.colors[id])));
    const classLegend = document.createElement("div");
    classLegend.className = "stem-class-legend";
    classLegend.setAttribute("aria-label", "Visible segmentation classes");
    classLegend.style.cssText = "display:flex; flex-wrap:wrap; gap:.75rem; font-size:.875rem";
    const updateLegend = (hiddenClasses) => {
      classLegend.replaceChildren();
      for (const [name, color] of classes) {
        if (hiddenClasses.includes(name)) continue;
        const label = document.createElement("span");
        label.style.cssText = "display:inline-flex; align-items:center; gap:.35rem";
        const swatch = document.createElement("span");
        swatch.setAttribute("aria-hidden", "true");
        swatch.style.cssText = `width:.8rem; height:.8rem; background:rgb(${color.join(",")}); border:1px solid currentColor`;
        label.append(swatch, document.createTextNode(name));
        classLegend.append(label);
      }
      classLegend.style.display = classLegend.childElementCount ? "flex" : "none";
    };
    if (classes.size) group.append(classLegend);
    const hasParticles = tasks.nanoparticles;
    const { button, dialog } = settings(VIEW_KEY);
    button.type = "button"; button.title = "STEM visualization settings";
    button.setAttribute("aria-label", button.title);
    button.disabled = !hasParticles && !classes.size;
    dialog.setAttribute("aria-label", "STEM visualization settings");
    // The native dialog sits inside the inference form. Enter in a number input
    // otherwise activates the host's default form button (reset/inference).
    dialog.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target.matches("input")) {
        event.preventDefault(); event.stopPropagation();
      }
    });
    const panel = document.createElement("div");
    panel.style.cssText = "display:flex; flex-direction:column; gap:.75rem; width:min(28rem,70vw)";
    dialog.style.maxHeight = "90vh";
    dialog.style.overflow = "auto";
    const title = document.createElement("h3"); title.textContent = "STEM visualization";
    panel.append(title);
    const makeControl = (labelText, name, type, max, step) => {
      const label = document.createElement("label");
      const text = document.createElement("span");
      const input = document.createElement("input");
      input.type = type; input.min = "0"; input.max = String(max); input.step = step;
      input.dataset.control = name; input.disabled = !hasParticles;
      input.style.cssText = "display:block; width:100%";
      input.setAttribute("aria-label", labelText);
      label.append(text, input); panel.append(label);
      const sync = () => { input.value = String(view[name]); text.textContent = `${labelText}: ${view[name].toFixed(2)}`; };
      input.addEventListener("input", () => {
        view = normalizeView({ ...view, [name]: input.valueAsNumber }, maximum, view.threshold);
        sync(); renderAll();
      });
      return sync;
    };
    const syncThreshold = hasParticles ? makeControl("Particle score threshold", "threshold", "range", maximum, "any") : () => { };
    const syncRadius = hasParticles ? makeControl("Minimum radius (original pixels)", "minRadius", "number", 1000000, "0.1") : () => { };
    const note = document.createElement("small");
    note.textContent = "Display settings do not affect downloaded detections or masks; these contain unfiltered data.";
    panel.append(note);
    const semanticGroup = document.createElement("fieldset");
    semanticGroup.disabled = !classes.size;
    semanticGroup.style.cssText = "display:flex; flex-direction:column; gap:.25rem";
    const legend = document.createElement("legend"); legend.textContent = "Segmentation classes";
    semanticGroup.append(legend);
    const checks = [];
    for (const [name, color] of classes) {
      const label = document.createElement("label");
      label.style.cssText = "display:flex; align-items:center; gap:.5rem; margin:.5rem 0";
      const check = document.createElement("input"); check.type = "checkbox"; check.dataset.className = name;
      const swatch = document.createElement("span");
      swatch.style.cssText = `width:1rem; height:1rem; background:rgb(${color.join(",")}); border:1px solid currentColor`;
      label.append(check, swatch, document.createTextNode(name)); semanticGroup.append(label);
      check.onchange = () => {
        view.hiddenClasses = [...new Set([...view.hiddenClasses.filter(n => n !== name), ...(check.checked ? [] : [name])])];
        renderAll();
      };
      checks.push([name, check]);
    }
    for (const [label, hidden] of [["All", false], ["None", true]]) {
      const action = document.createElement("button"); action.type = "button"; action.textContent = label;
      action.onclick = () => {
        view.hiddenClasses = view.hiddenClasses.filter(n => !classes.has(n));
        if (hidden) view.hiddenClasses.push(...classes.keys());
        syncControls(); renderAll();
      };
      semanticGroup.append(action);
    }
    if (tasks.segmentation) panel.append(semanticGroup);
    const syncControls = () => {
      syncThreshold(); syncRadius();
      checks.forEach(([name, check]) => check.checked = !view.hiddenClasses.includes(name));
    };
    const close = document.createElement("button"); close.type = "button"; close.textContent = "Close";
    close.onclick = () => dialog.close();
    panel.append(close); dialog.append(panel);
    (document.querySelector(".toolbar-right") || actions).append(button, dialog);
    syncControls();

    const rendered = [];
    results.forEach((result, i) => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex; flex-wrap:wrap; gap:1rem";
      for (let modality = 0; modality < 2; modality++) {
        const file = images[2 * i + modality];
        const figure = document.createElement("figure");
        figure.style.cssText = "margin:0; width:512px; max-width:100%";
        const canvas = document.createElement("canvas");
        canvas.setAttribute("role", "img");
        canvas.setAttribute("aria-label", `${modality ? "HAADF" : "BF"} inference overlay`);
        canvas.className = "stem-annotated";
        canvas.style.cssText = "display:block; max-width:min(512px,100%); height:auto";
        figure.append(canvas); row.append(figure);
        rendered.push({ canvas, file, result, sample: i, index: 2 * i + modality });
      }
      group.append(row);
    });
    let revision = 0, disposed = false, prepared = false, frame = null, downloading = false;
    group.setAttribute("aria-busy", "true");
    function drawAll() {
      frame = null;
      if (disposed || !prepared) return;
      rendered.forEach(item => drawAnnotated(item, view));
      updateLegend(view.hiddenClasses);
      group.dataset.particleCount = String(results.reduce((n, r) => n + filterParticles(r, view).centers.length, 0));
      group.dataset.revision = String(++revision);
      group.setAttribute("aria-busy", "false");
    }
    function renderAll() {
      if (disposed) return;
      // Inputs update local state immediately; at most one draw per animation frame.
      try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (_) { /* private storage */ }
      if (prepared && frame === null) {
        group.setAttribute("aria-busy", "true");
        frame = requestAnimationFrame(drawAll);
      }
    }
    async function prepare() {
      try {
        const semantics = await Promise.all(results.map(r => prepareSemantic(r.segmentation)));
        const sources = await Promise.all(rendered.map(item => loadBrowserImage(item.file)));
        if (disposed) return;
        rendered.forEach((item, i) => {
          item.source = sources[i]; item.semantic = semantics[item.sample];
          item.canvas.width = item.source.naturalWidth; item.canvas.height = item.source.naturalHeight;
        });
        prepared = true;
        drawAll();
        imageDownload.disabled = !rendered.length;
        maskDownload.disabled = !results.some(r => r.segmentation);
      } catch (error) {
        if (disposed) return;
        group.setAttribute("aria-busy", "false");
        showToast("error", `Could not render images: ${error.message}`);
        console.error(error);
      }
    }
    imageDownload.onclick = async () => {
      if (!prepared || disposed || downloading) return;
      downloading = true; imageDownload.disabled = true;
      try {
        // Flush pending inputs, then invoke every encoder synchronously. toBlob snapshots
        // each canvas now, so later inputs cannot mix settings within the archive.
        if (frame !== null) cancelAnimationFrame(frame);
        drawAll();
        const entries = await Promise.all(rendered.map(async item => ({
          name: annotatedFilename(item.file, item.index), blob: await canvasToBlob(item.canvas),
        })));
        const archive = await buildZip(entries);
        if (!disposed) downloadBlob(archive, "results-cedirnet-images.zip");
      } catch (error) { showToast("error", `Could not prepare images: ${error.message}`); }
      finally { downloading = false; if (!disposed) imageDownload.disabled = false; }
    };
    const form = document.getElementById("@ALIAS@").closest("form");
    const dispose = () => {
      disposed = true;
      if (frame !== null) cancelAnimationFrame(frame);
      rendered.forEach(item => {
        item.source = null; item.semantic = null;
        item.canvas.width = item.canvas.height = 0;
      });
      button.remove(); dialog.remove();
      for (const event of ["infer", "reset", "softreset"]) form?.removeEventListener(event, dispose);
    };
    dialog.stemDispose = dispose;
    for (const event of ["infer", "reset", "softreset"]) form?.addEventListener(event, dispose);
    prepare();
    return [actions, group];
  };
</script>
