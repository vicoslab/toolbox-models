title: STEM Nanoparticles and Multiclass Segmentation
type: community
group: Counting
image:
details: |
  <h1>STEM nanoparticles and semantic regions</h1>
  <p>Create groups of two registered images in BF, HAADF order. The model combines BF grayscale, HAADF grayscale, and a zero third channel.</p>
  <p>Use the Particle instances and Segmentation panels beside the image. Annotation tools do not change training options. Submit an annotation without particle regions for a particle-free pair; images with no submitted annotation remain missing supervision.</p>
  <p>Use Ellipse for particles and Polygon, Brush or Magicwand for segmentation in their respective panels. Cross-label tool use is also supported. Ellipses train the particle circle model using the mean of their pixel radii; particle polygons and brushes use their pixel centroid and equal-area radius. Each region is one instance. Export creates the paired-image manifest and class-ID masks; conflicting classes and unpainted pixels are ignored.</p>
config: |
  <View className="toolbox-annotation">
    <Style>
      .toolbox-annotation h4 {font-size:13px;line-height:18px;font-weight:normal;margin:6px 0 !important;}
      .ant-collapse { width: 100%; }
    </Style>
    <View style="display: grid; grid-template-columns: 1fr minmax(0, 256px); gap: 16px;">
      <Image name="image" valueList="$images" zoom="true" gallery="true" shared="true" />
      <View style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; flex: 0 0 380px;">
        <Collapse open="true" bordered="true">
          <Panel value="Split">
            <Choices name="split" showInline="true" choice="single-radio">
              <Choice value="Train"/>
              <Choice value="Validation"/>
              <Choice value="Test"/>
              <Choice value="Auto" selected="true" />
            </Choices>
          </Panel>
        </Collapse>
        <Collapse open="true" bordered="true">
          <Panel value="Particle instances">
            <Header size="5" value="Select particle class, then draw an ellipse (center click first)." />
            <Labels name="labels" toName="image" canRotate="true" strokeWidth="2" opacity="0.3">
              <Label value="PtCo" alias="nanoparticle" background="#14c850" hotkey="p" />
            </Labels>
            <Ellipse name="points" toName="image" />
            <Header size="6" value="The center and mean pixel radius train the circle model; ellipse rotation and eccentricity are not predicted." />
          </Panel>
        </Collapse>
        <Collapse open="true" bordered="true">
          <Panel value="Segmentation">
            <Header size="5" value="Select a class, then select Brush or Polygon tool to define its region." />
            <Labels name="semantic" toName="image">
              <Label value="Carbon" background="#f24949" hotkey="c" category="0" />
              <Label value="Film" background="#49f249" hotkey="f" category="1" />
              <Label value="Vacuum" background="#4949f2" hotkey="v" category="2" />
              <Label value="Ignore" background="#808080" hotkey="i" category="255" hint="Use when unsure which category." />
            </Labels>
            <Polygon name="polygon" toName="image" />
            <Brush name="brush" toName="image" />
            <Header size="6" value="Press ESC before selecting the next class." />
            <Magicwand name="wand" toName="image" />
          </Panel>
        </Collapse>
        <Collapse open="true" bordered="true">
          <Panel value="Smart tools">
            @SMART_TOOLS@
          </Panel>
        </Collapse>
      </View>
    </View>
  </View>
