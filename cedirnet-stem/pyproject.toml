[project]
name = "toolbox-cedirnet-stem"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1.3",
    "future>=1.0.0",
    "gunicorn>=27.0.1",
    "label-studio-converter==0.0.59",
    "label-studio-ml",
    "matplotlib>=3.11.2",
    "mlflow>=1.27.0",
    "modelargs",
    "opencv-python==4.11.0.86",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "segmentation-models-pytorch==0.3.3",
    "six>=1.17.0",
    "tensorboard>=2.21.0",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
label-studio-ml = { path = "/opt/apps/label-studio-ml-backend", editable = true }
modelargs = { path = "/opt/apps/modelargs", editable = true }
