[project]
name = "toolbox-super-simple-net"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "albumentations>=2.0.8",
    "anomalib==2.7.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "label-studio-ml",
    "lightning>=2.6.6",
    "mlflow>=3.16.0",
    "modelargs",
    "numpy<=2.5.4",
    "opencv-python>=5.0.0.93",
    "protobuf==5.26.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
    "tifffile>=2026.11.16",
    "torch==2.7.0+cu118",
    "torchvision==0.22.0+cu118",
]

[tool.uv.sources]
modelargs = { path = "/opt/apps/modelargs", editable = true }
label-studio-ml = { path = "/opt/apps/label-studio-ml-backend", editable = true }
