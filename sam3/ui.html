<soft-reset></soft-reset>
<infer-image name="image">
    <infer-bbox id="@ALIAS@" name="boxes">
        <div id="results"></div>
    </infer-bbox>
</infer-image>

<script>
    document.getElementById("@ALIAS@").onInference = function (request, response) {
        const showDetections = document.createElement("show-detections");
        showDetections.boxes = response.boxes;
        showDetections.exemplars = JSON.parse(request.get("boxes"));
        showDetections.masks = response.masks.map(x => `data: image/webp; base64, ${x}`);
        showDetections.scores = response.scores;
        showDetections.settings = true;
        showDetections.reference = URL.createObjectURL(request.get("image"));
        return showDetections;
    }
</script>
